on:
  push:
    - workflows: [build-site]
      filter:
        branches: [main]

workflows:
  build-site:
    tasks:
      - name: build-and-publish
        cubes:
          - name: build-and-publish
            image: ruby:3.3
            env:
              JEKYLL_ENV: production
            script:
              - ruby qa/validate_course.rb
              - gem install jekyll --version "~> 4.4" --no-document
              - |
                set -eu
                echo "Building for SourceCraft Sites path: /network-systems-course"
                jekyll build --destination site --baseurl "/network-systems-course"
              - test -s site/index.html
              - test -s site/labs/lx0.html
              - test -s site/labs/lx7.html
              - test -s site/resources/lx2-reference.html
              - grep -q 'data-learning-deck="lx0"' site/labs/lx0.html
              - grep -q 'data-learning-deck="lx7"' site/labs/lx7.html
              - bash .sourcecraft/publish.sh
