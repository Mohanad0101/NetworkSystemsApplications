- code: NP1
  id: np1
  module: network
  title: Использование сокетов
  source: https://koroteev.site/os/3/3-sockets/
  outcome: Простой клиент и сервер, обменивающиеся данными.
  idea: 'Сокет — интерфейс программы для сетевого обмена. Для TCP сервер обычно выполняет bind/listen/accept, а клиент — connect.
    UDP работает с датаграммами и не требует обязательного установления соединения; connect для UDP может использоваться как
    удобная привязка к peer. TCP передаёт поток байтов: границы отдельных send не превращаются автоматически в границы сообщений.
    Формат и границы сообщения задаёт протокол приложения.'
  concepts:
  - сокет
  - TCP и UDP
  - адрес и порт
  - формат сообщения
  practice:
  - Простой эхо-сервер и клиент.
  - Проверка обмена, разрыва соединения и границ сообщений.
  question: Обязательно ли один recv вернёт всё сообщение, отправленное через TCP?
  answer: Нет. Он может вернуть часть данных или данные нескольких отправок. Программа должна собирать сообщения по правилам
    своего протокола.
