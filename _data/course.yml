- code: NP2
  id: np2
  module: network
  title: Асинхронное программирование
  source: https://koroteev.site/os/3/4-threading/
  outcome: Выбор подходящей модели одновременной работы.
  idea: Потоки, процессы и asyncio решают задачи конкурентного выполнения разными способами. Асинхронность особенно полезна
    при ожидании ввода-вывода, но сама по себе не ускоряет вычисление. В обычной сборке CPython с включённым GIL потоки подходят
    прежде всего для конкурентного I/O, а для CPU-bound параллелизма часто используют процессы; free-threaded сборки CPython
    существуют, но не являются режимом по умолчанию. В современном Python верхнеуровневой точкой входа для типичного asyncio-приложения
    служит asyncio.run(). При выборе модели учитывают тип нагрузки, обмен данными и стоимость координации.
  concepts:
  - потоки
  - процессы
  - asyncio
  - ожидание и параллелизм
  practice:
  - Многопоточный сервер и многопроцессные вычисления.
  - Задачи и сетевое ожидание в asyncio.
  question: Станет ли тяжёлое вычисление быстрее, если только добавить к функции async?
  answer: Нет. async задаёт возможность асинхронного взаимодействия, а не автоматически распределяет вычисления между ядрами.
