modules:
- id: linux
  number: '01'
  title: Основы Linux
  codes: LX0–LX4
  goal: Понимать среду, в которой работает программа.
  description: Установка, командная строка, удалённый доступ, права, процессы и пакеты.
- id: admin
  number: '02'
  title: Администрирование Linux
  codes: LX5–LX9
  goal: Настраивать систему и автоматизировать повторяющиеся действия.
  description: Загрузка и службы, файловые системы, Bash, обработка текста и диагностика сети.
- id: network
  number: '03'
  title: Сетевое программирование
  codes: DO0–DO1 · NP1–NP4 · DO2
  goal: Создавать, проверять и развёртывать сетевые приложения.
  description: Среда Python, Git, сокеты, конкурентность, безопасность, веб-сервисы и развёртывание.
lessons:
- code: LX0
  id: lx0
  module: linux
  title: Введение в ОС Linux
  source: https://koroteev.site/os/1/0-vm_installation/
  outcome: Собственная Linux-машина и проверенная переносимая копия.
  idea: Выберем способ запуска Linux, установим Mint в VirtualBox и проверим переносимость стенда через экспорт и импорт OVA.
    Общие понятия Linux и роль курса в подготовке разработчика разобраны во введении на главной странице.
  concepts:
  - хост и гость
  - виртуальное оборудование
  - VM, WSL 2, Docker и VPS
  - ISO и OVA
  practice:
  - Linux Mint в VirtualBox; первые команды и паспорт среды.
  - 'Экспорт и импорт OVA. Дополнительно: WSL, Docker и установка на оборудование.'
  question: Почему установленная программа и запущенный процесс — не одно и то же?
  answer: Программа хранится в файлах. Процесс — выполняющийся экземпляр программы, которому ОС выделяет ресурсы. Одну программу
    можно запустить несколько раз.
  ready: true
  lab: /labs/lx0.html
  quiz: /labs/lx0.html#quiz
  quiz_count: 10
  practicals:
  - title: 'Лабораторная: Установка Linux в виртуальную машину'
    source: https://koroteev.site/text/os00-1/
    source_label: Оригинал задания
    local: /labs/lx0.html#install
- code: LX1
  id: lx1
  module: linux
  title: Основы командной строки
  source: https://koroteev.site/os/1/1-cli/
  outcome: Понимание структуры команды, уверенная навигация по путям и безопасная работа с файлами, потоками, ссылками и архивами.
  idea: Bash интерпретирует командную строку и запускает встроенные команды или программы. Текущий каталог определяет смысл
    относительного пути; опции изменяют поведение команды, а аргументы указывают объект работы. Небольшие команды можно
    связывать потоками, но сначала студент должен понимать каждую операцию отдельно.
  concepts:
  - терминал, Bash и структура команды
  - справка man / --help / help
  - абсолютные и относительные пути
  - файловые операции и безопасное удаление
  - потоки, ссылки и архивы
  practice:
  - 10 основных команд с пошаговым объяснением путей и файловых операций.
  - Служебные команды, перенаправление, каналы, ссылки и проверяемое восстановление архива.
  question: Почему команда может работать в одном каталоге и не находить файл в другом?
  answer: Относительный путь отсчитывается от текущего каталога. Проверьте pwd и используйте корректный относительный либо
    абсолютный путь.
  ready: true
  lab: /labs/lx1.html
  quiz: /labs/lx1.html#quiz
  quiz_count: 12
  practicals:
  - title: 'Практика: 10 основных команд'
    source: https://koroteev.site/text/os11-1/
    source_label: Оригинал задания
    local: /labs/lx1.html#practice-basic
  - title: 'Практика: Служебные команды'
    source: https://koroteev.site/text/os11-2/
    source_label: Оригинал задания
    local: /labs/lx1.html#practice-service
  - title: 'Практика: Работа с файлами'
    source: https://koroteev.site/text/os11-4/
    source_label: Оригинал задания
    local: /labs/lx1.html#practice-files
- code: LX2
  id: lx2
  module: linux
  title: Использование удалённого доступа по SSH
  source: https://koroteev.site/os/1/2-ssh/
  outcome: Удалённая работа с сервером и устойчивый терминальный сеанс.
  idea: 'SSH создаёт защищённое соединение между клиентом и сервером. После входа команды выполняются на удалённой машине.
    tmux управляет терминальными сеансами на этой машине: отсоединение клиента не обязано завершать запущенную в tmux работу.'
  concepts:
  - клиент и сервер
  - порт
  - ключи SSH
  - сеанс tmux
  practice:
  - SSH-подключение, передача файлов и вход по ключу.
  - Создание, отсоединение и восстановление сеанса tmux.
  question: Сохраняет ли tmux задачу после перезагрузки сервера?
  answer: Нет. Он помогает пережить разрыв подключения, но обычные процессы завершаются при перезагрузке. Для автоматического
    запуска служб применяются другие средства.
  ready: true
  lab: /labs/lx2.html
  quiz: /labs/lx2.html#quiz
  quiz_count: 12
  practicals:
  - title: 'Практика: SSH'
    source: https://koroteev.site/text/os12-1/
    source_label: Оригинал задания
    local: /labs/lx2.html#practice-ssh
  - title: 'Практика: Tmux'
    source: https://koroteev.site/text/os12-2/
    source_label: Оригинал задания
    local: /labs/lx2.html#practice-tmux
- code: LX3
  id: lx3
  module: linux
  title: Права и пользователи
  source: https://koroteev.site/os/1/3-users/
  outcome: Общий рабочий каталог с осмысленно настроенным доступом.
  idea: Доступ определяется учётной записью, группами и правами объектов. Значение r, w и x зависит от того, файл это или
    каталог. Административные права стоит применять к конкретному действию, а не использовать как универсальный способ убрать
    ошибку доступа.
  concepts:
  - UID и GID
  - владелец и группа
  - rwx
  - sudo и umask
  practice:
  - Пользователи и группы; владельцы и права.
  - Общий каталог, проверка доступа и специальные биты.
  question: Почему право записи в файл не всегда позволяет удалить его?
  answer: Удаление имени связано с правами на родительский каталог; дополнительные ограничения, например sticky bit, тоже
    могут влиять на результат.
  ready: true
  lab: /labs/lx3.html
  quiz: /labs/lx3.html#quiz
  quiz_count: 12
  practicals:
  - title: 'Практика: Управление пользователями'
    source: https://koroteev.site/text/os13-1/
    source_label: Оригинал задания
    local: /labs/lx3.html#practice-users
  - title: 'Практика: Права доступа'
    source: https://koroteev.site/text/os13-2/
    source_label: Оригинал задания
    local: /labs/lx3.html#practice-permissions
- code: LX4
  id: lx4
  module: linux
  title: Процессы и пакеты в Linux
  source: https://koroteev.site/os/1/4-processes/
  outcome: Установка и проверка пакета, наблюдение за процессом и безопасное управление его состоянием.
  idea: Пакет описывает установленные файлы, версию и зависимости программы. Процесс — конкретный работающий экземпляр с PID,
    состоянием и ресурсами. Установка пакета и запуск процесса — разные этапы; завершение процесса не удаляет программу.
  concepts:
  - пакеты и зависимости
  - APT и dpkg
  - PID, PPID и /proc
  - сигналы и состояния
  - nice и job control
  practice:
  - Симуляция, установка, проверка и безопасная очистка учебного пакета.
  - Наблюдение за собственным процессом и управление STOP/CONT/TERM и nice.
  question: Почему после завершения процесса программу можно запустить снова?
  answer: Исполняемые файлы остаются установленными. Завершение процесса освобождает ресурсы конкретного запуска, а не удаляет
    пакет.
  ready: true
  lab: /labs/lx4.html
  quiz: /labs/lx4.html#quiz
  quiz_count: 12
  practicals:
  - title: 'Практика: Пакеты и зависимости'
    source: https://koroteev.site/os/1/4-processes/
    source_label: Структура исходной темы
    local: /labs/lx4.html#packages-environment
  - title: 'Практика: Процессы и сигналы'
    source: https://koroteev.site/os/1/4-processes/
    source_label: Структура исходной темы
    local: /labs/lx4.html#process-observe
- code: LX5
  id: lx5
  module: admin
  title: Управление загрузкой Linux и службами systemd
  source: https://koroteev.site/os/2/1-init/
  outcome: Собственная systemd-служба с проверенным unit-файлом, автозапуском, журналом и понятным lifecycle.
  idea: В Linux с systemd загрузка организуется через targets и зависимости units. Описание службы, её текущее состояние и
    политика автозапуска — разные уровни. Хорошая диагностика сначала проверяет программу, затем unit, runtime state и journal.
  concepts:
  - загрузка Linux и default.target
  - systemd units и targets
  - Type=exec и ExecStart
  - enable/start/restart
  - journalctl и диагностика
  - базовый sandbox службы
  practice:
  - Наблюдение за загрузкой и текущими systemd targets.
  - Создание безопасной Python heartbeat-службы и unit-файла.
  - Проверка enable/start, MainPID, journal и restart с последующей очисткой.
  question: Почему systemctl enable не равен systemctl start?
  answer: enable настраивает связи автозапуска согласно [Install], а start активирует unit сейчас. Для совместного действия
    можно использовать --now, когда это осознанно нужно.
  ready: true
  lab: /labs/lx5.html
  quiz: /labs/lx5.html#quiz
  quiz_count: 12
  practicals:
  - title: 'Практика: Создание и управление службами'
    source: https://koroteev.site/text/os21-1/
    source_label: Оригинал задания
    local: /labs/lx5.html#service-program
  - title: 'Практика: Автозапуск и диагностика systemd'
    source: https://koroteev.site/os/2/1-init/
    source_label: Структура исходной темы
    local: /labs/lx5.html#service-lifecycle
- code: LX6
  id: lx6
  module: admin
  title: Управление файловыми системами в Linux
  source: https://koroteev.site/os/2/2-filesystems/
  outcome: Безопасно созданная ext4-файловая система в loop-образе, проверенное монтирование и UUID-based конфигурация без
    изменения реального диска.
  idea: 'Файловая система организует данные на блочном устройстве, а mount присоединяет её к единому дереву каталогов. В LX6
    опасные операции изолированы в обычном image-файле через /dev/loopN: студент получает реальный опыт mkfs/mount/fstab без
    риска для основного диска VM.'
  concepts:
  - block device, раздел и файловая система
  - df, du, lsblk и findmnt
  - loop device и ext4
  - mount/umount и mount point
  - UUID/LABEL и fstab
  - сетевая файловая система NFS
  practice:
  - Наблюдение за storage map и безопасная работа с dd только в обычный файл.
  - Создание ext4 внутри loop image; mount/umount и сохранность данных.
  - Проверка отдельного UUID-based fstab; знакомство с моделью NFS.
  question: Почему в LX6 можно безопасно выполнить mkfs.ext4, хотя форматирование настоящего диска опасно?
  answer: Перед mkfs студент проверяет, что выбранное устройство имеет вид /dev/loopN и его backing file точно совпадает с
    ~/NSA/LX6/lx6-ext4.img. Реальные диски и разделы в обязательном пути не форматируются.
  ready: true
  lab: /labs/lx6.html
  quiz: /labs/lx6.html#quiz
  quiz_count: 12
  practicals:
  - title: 'Практика: Файловые системы'
    source: https://koroteev.site/os/2/2-filesystems/
    source_label: Оригинальная структура темы
    local: /labs/lx6.html#storage-map
  - title: 'Практика: Безопасный loop image и mount'
    source: https://man7.org/linux/man-pages/man4/loop.4.html
    source_label: Современная документация Linux
    local: /labs/lx6.html#loop-image
  - title: 'Практика: Сетевые файловые системы'
    source: https://koroteev.site/os/2/2-filesystems/
    source_label: Тема автора
    local: /labs/lx6.html#network-cleanup
- code: LX7
  id: lx7
  module: admin
  title: Основы скриптов на Bash
  source: https://koroteev.site/os/2/3-bash/
  outcome: Проверенный Bash-сценарий, понятные коды завершения, контроль целостности SHA-256 и безопасная пользовательская
    задача cron.
  idea: Bash-сценарий превращает последовательность команд в повторяемую процедуру. Надёжность начинается с явного интерпретатора,
    кавычек, проверки синтаксиса и осмысленных кодов завершения. Cron запускает сценарий в другом контексте, поэтому пути
    и окружение нужно задавать явно. Контрольная сумма помогает обнаружить изменение байтов, но не заменяет доверенный источник
    или цифровую подпись.
  concepts:
  - shebang и исполняемый файл
  - переменные, параметры и кавычки
  - условия, case и exit status
  - PATH и окружение
  - SHA-256 и доверенная baseline
  - пользовательский crontab
  practice:
  - Первый сценарий, bash -n, параметры и безопасное добавление учебного каталога в PATH текущей сессии.
  - Сценарий system-report с case и осмысленным exit status.
  - Проверка изменения файла через SHA-256 и восстановление доверенной baseline.
  - Пользовательская cron-задача с явным окружением, наблюдением одного запуска и аккуратным удалением только LX7-блока.
  question: Почему сценарий может успешно работать из терминала, но вести себя иначе при запуске из cron?
  answer: У cron может быть другое окружение, PATH и рабочий контекст. Поэтому для автоматизации полезно использовать абсолютные
    пути, явно задавать необходимое окружение и писать диагностический вывод в известный лог.
  ready: true
  lab: /labs/lx7.html
  quiz: /labs/lx7.html#quiz
  quiz_count: 12
  practicals:
  - title: 'Практика: Ваш первый сценарий'
    source: https://koroteev.site/text/os23-1/
    source_label: Оригинал задания
    local: /labs/lx7.html#first-script
  - title: 'Практика: Работа с cron'
    source: https://koroteev.site/text/os23-2/
    source_label: Оригинал задания
    local: /labs/lx7.html#cron-safe
  - title: 'Дополнительно: контрольные суммы — современная версия SHA-256'
    source: https://koroteev.site/text/os23-3/
    source_label: Исходная идея MD5, обновлённая в локальной LX7
    local: /labs/lx7.html#checksum
- code: LX8
  id: lx8
  module: admin
  title: Средства обработки текста
  source: https://koroteev.site/os/2/4-text/
  outcome: Полезная информация, извлечённая из журналов и оформленная в отчёт.
  idea: Журналы и текстовые файлы можно рассматривать как поток записей. Фильтрация выбирает нужные строки, преобразование
    меняет их представление, а агрегирование помогает увидеть повторения и частоты. Регулярное выражение описывает шаблон;
    его нужно проверять на подходящих и неподходящих примерах.
  concepts:
  - grep
  - sed и awk
  - регулярные выражения
  - отчёты
  practice:
  - Формирование HTML-отчёта.
  - Разбор журналов, фильтрация и сводная информация.
  question: Почему совпадение с шаблоном ещё не доказывает правильность всей обработки?
  answer: Нужны также проверки строк, которые не должны совпасть, пустого ввода и особых символов. Один успешный пример не
    покрывает все случаи.
  ready: false
  lab: null
  quiz: null
  quiz_count: null
  practicals:
  - title: 'Практика: Создание HTML-отчета'
    source: https://koroteev.site/text/os24-1/
    source_label: Оригинал задания
    local: null
  - title: 'Практика: Парсинг лог-файлов'
    source: https://koroteev.site/text/os24-2/
    source_label: Оригинал задания
    local: null
- code: LX9
  id: lx9
  module: admin
  title: Настройка сетевой среды в Linux
  source: https://koroteev.site/os/2/5-network/
  outcome: Последовательная диагностика сетевой проблемы.
  idea: 'Сетевое соединение зависит от интерфейса, адреса, маршрута, разрешения имени и доступности службы. Эти уровни стоит
    проверять отдельно. Отсутствие ответа ping не доказывает недоступность веб-сервиса: ICMP может фильтроваться, а TCP-соединение
    — работать.'
  concepts:
  - IP и подсети
  - маршрутизация
  - DNS
  - NAT и порты
  practice:
  - Диагностика адресов, маршрутов и доступности узлов.
  - Сравнение режимов сетевого подключения VM.
  question: Узел доступен по IP, но не по имени. Какую подсистему проверить следующей?
  answer: 'Проверьте подсистему разрешения имён: результат системного lookup, /etc/hosts и порядок источников NSS, а затем
    DNS, если он используется. Доступность по IP уже помогает отделить эту проблему от базовой IP-маршрутизации.'
  ready: false
  lab: null
  quiz: null
  quiz_count: null
  practicals:
  - title: 'Практика: Диагностика сетей'
    source: https://koroteev.site/text/os25-1/
    source_label: Оригинал задания
    local: null
  - title: 'Дополнительно: Способы сетевых подключений виртуальных машин'
    source: https://docs.google.com/document/d/1H1ozZckECh1R4Rj5nP_S8urGUUyRfL-NSHBC_Rn9fvw/edit?usp=sharing
    source_label: Методичка автора
    local: null
- code: DO0
  id: do0
  module: network
  title: Использование Linux для разработки
  source: https://koroteev.site/os/3/0-environment/
  outcome: Среда Python, которую можно воспроизвести для проекта.
  idea: 'Проекту нужен не просто интерпретатор, а согласованное окружение: версия Python, зависимости и способ запуска. Изоляция
    зависимостей помогает не смешивать требования разных проектов, но сама по себе не гарантирует воспроизводимость: фиксируйте
