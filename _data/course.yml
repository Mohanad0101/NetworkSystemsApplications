  id: np4
  module: network
  title: Веб-сервер
  source: https://koroteev.site/os/4/2-web-server/
  outcome: Понимание пути HTTP-запроса от клиента до ответа сервера.
  idea: HTTP задаёт семантику запросов и ответов. Веб-сервер принимает трафик, может отдавать файлы или передавать запрос
    приложению. HTTP/1.1 и HTTP/2 обычно используют TCP (для HTTPS — с TLS), а HTTP/3 переносит HTTP-семантику поверх QUIC/UDP.
    Код состояния и журналы помогают локализовать ошибку. Виртуальные хосты позволяют одному серверу обслуживать несколько
    имён.
