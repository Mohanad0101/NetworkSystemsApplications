- code: NP3
  id: np3
  module: network
  title: Безопасность сетевых приложений
  source: https://koroteev.site/os/4/1-tls/
  outcome: Понимание задач шифрования, проверки подлинности и защищённого обмена.
  idea: 'Конфиденциальность, целостность и аутентификация — разные свойства защиты. Симметричные и асимметричные методы используются
    совместно в современных протоколах. Классические шифры и упрощённый обмен ключами допустимы только как модели для изучения
    принципов и слабостей: неаутентифицированный обмен Диффи–Хеллмана, например, сам по себе не защищает от активной атаки
    посредника. Для реальных приложений используют стандартизованные протоколы, аутентифицированное шифрование и проверенные
    библиотеки, а не собственную криптосхему.'
  concepts:
  - ключи
  - шифрование
  - аутентификация
  - TLS
  practice:
  - Анализ учебных шифров как моделей и обсуждение причин, по которым их нельзя применять для реальной защиты.
  - TLS-рукопожатие, аутентификация peer и установление защищённого обмена с использованием проверенной библиотеки.
  question: Достаточно ли зашифровать данные, чтобы знать, с кем установлено соединение?
  answer: Нет. Нужна аутентификация другой стороны. В типичном HTTPS сервер подтверждает подлинность сертификатом и владением
    соответствующим закрытым ключом; TLS 1.3 также предусматривает режимы с предварительно общим ключом (PSK).
