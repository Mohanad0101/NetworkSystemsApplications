- code: DO2
  id: do2
  module: network
  title: Создание и развёртывание серверного приложения
  source: https://koroteev.site/os/4/5-deploy/
  outcome: Приложение, запуск и обновление которого можно повторить.
  idea: Развёртывание переносит приложение из среды разработки в среду работы. Помимо кода нужны зависимости, конфигурация,
    права, сеть, данные и проверка работоспособности. При контейнерном развёртывании образ и контейнер — разные сущности,
    а данные, которые должны пережить удаление контейнера, размещают в подходящем постоянном хранилище, например volume или
    bind mount. История версий и понятный порядок обновления помогают повторить запуск и восстановиться после неудачного изменения.
  concepts:
  - конфигурация
  - зависимости
  - развёртывание
  - проверка сервиса
  practice:
  - Развёртывание вручную, через Git и с помощью Docker.
  - Учебный файловый сервис поверх сокетов не следует называть FTP, если он не реализует стандартный протокол FTP. Классический
    FTP сам по себе не шифрует учётные данные и содержимое; SFTP — отдельный протокол поверх SSH, а FTPS добавляет TLS к FTP.
    Для реального сервиса протокол выбирают по требованиям и модели угроз.
  question: Почему одного сообщения «процесс запущен» недостаточно для проверки развёртывания?
  answer: Процесс может работать, но не обслуживать запросы. Нужны проверка доступности, ожидаемого ответа и журналов приложения.
