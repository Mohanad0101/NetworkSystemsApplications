  lx0:
    title: Установка Linux в виртуальную машину
    evidence:
    - id: LX0-01
      kind: screenshot
      stage: Установленная Mint
      proof: Окно VirtualBox с установленной Linux Mint и терминалом, где видны whoami и hostname. ISO уже извлечён.
    - id: LX0-02
      kind: text
      stage: Паспорт среды
      proof: 'Вставьте текст из verification.txt: пользователь, hostname, версия ОС, ядро и краткий вывод ip -br a. Секреты
        и пароли не нужны.'
    - id: LX0-03
      kind: screenshot
      stage: Проверка импортированной копии
      proof: Видны исходная VM и импортированная copy; в терминале копии читается сохранённый hello.txt. Имя VM отличается;
        hostname может совпадать.
    - id: LX0-04
      kind: screenshot
      stage: Две VM одновременно
      proof: Две отдельные VM одновременно имеют состояние Running. Лучше один кадр с менеджером и двумя окнами; допустимы
        04a/04b, если экран небольшой.
    - id: LX0-Q
      kind: text
      stage: MCQ
      proof: После ответа на все вопросы MCQ считается завершённым для комплектности. Число правильных ответов остаётся формативной
        обратной связью и не является автоматической оценкой лабораторной.
