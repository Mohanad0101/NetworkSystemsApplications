  lx5:
    title: Управление загрузкой Linux и службами systemd
    evidence:
    - id: LX5-01
      kind: text
      stage: Загрузка и targets
      proof: Вставьте boot-summary.txt и 3–5 строк активных targets/services. Полные списки не нужны.
    - id: LX5-02
      kind: text
      stage: Ручная проверка программы
      proof: Вставьте PYTHON_CHECK=OK и короткий manual-test.txt с LX5_START, 2–3 heartbeat и корректным завершением.
    - id: LX5-03
      kind: text
      stage: Unit-файл и verify
      proof: Вставьте UNIT_VERIFY=OK, фактического SERVICE_USER и unit из systemctl cat lx5-heartbeat.service.
    - id: LX5-04
      kind: text
      stage: Enable, start, journal и restart
      proof: Вставьте lifecycle.txt и 4–6 последних строк journal с heartbeat/restart. Полный journal не нужен.
    - id: LX5-Q
      kind: text
      stage: MCQ
      proof: После прохождения всех 12 вопросов MCQ считается завершённым для комплектности. Повторные попытки разрешены,
        помогают учиться и не являются штрафом или оценкой.
    files: []
    questions:
    - Почему enable и start являются разными действиями и что вы увидели после enable до start?
    - Почему в учебной unit используется Type=exec и когда после изменения unit нужен daemon-reload?
    - Как изменился MainPID после restart и какие команды вы использовали бы первыми при failed service?
    complete: Изучены PID 1/default target; программа проверена вручную; unit прошла systemd-analyze verify; enable и start
