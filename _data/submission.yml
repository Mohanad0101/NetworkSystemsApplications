  lx4:
    title: Процессы и пакеты в Linux
    evidence:
    - id: LX4-01
      kind: text
      stage: Пакетная среда
      proof: Вставьте environment.txt, htop-before.txt и первые строки apt-cache policy htop. Полный список пакетов не нужен.
    - id: LX4-02
      kind: text
      stage: Установка и проверка htop
      proof: Вставьте htop-installed.txt, несколько первых путей dpkg-query -L htop и строку APT_CHECK=OK.
    - id: LX4-03
      kind: text
      stage: Наблюдение за процессом
      proof: Вставьте LAB_PID, одну строку ps и Name/State/Pid/PPid/Threads из /proc/<PID>/status для вашего sleep.
    - id: LX4-04
      kind: text
      stage: Сигналы и nice
      proof: Вставьте AFTER_STOP/AFTER_CONT с ps, NICE_AFTER=15 и финальные PID_..._FINISHED=YES для двух тестовых процессов.
    - id: LX4-Q
      kind: text
      stage: MCQ
      proof: После прохождения всех 12 вопросов MCQ считается завершённым для комплектности. Повторные попытки разрешены и
        не являются штрафом или оценкой.
    files: []
    questions:
    - Почему для обычной установки из настроенного репозитория APT удобнее прямого dpkg?
    - Что показали PID, PPID и State вашего sleep и как /proc подтвердил данные ps?
    - Почему SIGTERM обычно используют перед SIGKILL и что означает увеличение nice value с 10 до 15?
    complete: Пакетная среда исследована; установка htop предварительно смоделирована и проверена; собственный процесс сопоставлен
      с /proc; STOP/CONT/TERM и nice выполнены только на контролируемых процессах; четыре текстовых результата и MCQ внесены
