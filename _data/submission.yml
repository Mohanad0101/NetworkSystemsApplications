      proof: 'Вставьте checksum-summary.txt: SHA256, BASELINE_CHECK=OK, AFTER_CHANGE=CHANGED и AFTER_RESTORE=OK.'
    - id: LX7-04
      kind: text
      stage: Пользовательский cron
      proof: Вставьте cron-summary.txt и блок NSA-LX7-BEGIN/END из user crontab. Достаточно 1–3 строк LX7_CRON; личные cron-задачи
