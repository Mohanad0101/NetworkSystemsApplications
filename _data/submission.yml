  lx2:
    title: Удалённый доступ — SSH и tmux
    evidence:
    - id: LX2-01
      kind: text
      stage: SSH-сервер готов
      proof: "Вставьте только короткий вывод сводной проверки с SSH_SERVICE, USER, HOST и ip -br a; одной строкой допишите режим сети и порт. Полный журнал APT не нужен."
    - id: LX2-02
      kind: text
      stage: Удалённый вход и передача файла
      proof: "Вставьте только подписанные строки REMOTE_USER, REMOTE_HOST, REMOTE_HOME, UPLOAD и DOWNLOAD из сводных проверок. Полный SSH/SCP-транскрипт не нужен."
    - id: LX2-03
      kind: text
      stage: Вход по ключу
      proof: "Вставьте только строки AUTH=publickey, USER и HOST из проверки с PasswordAuthentication=no. Ключи, fingerprint private key и passphrase не вставляйте."
    - id: LX2-04
      kind: text
      stage: tmux после повторного входа
      proof: "Вставьте только короткий BEFORE/AFTER_RECONNECT вывод: SESSION, PANE, SHELL_PID и CMD. Совпадающие идентификаторы подтверждают ту же панель, CMD=htop — продолжающуюся программу."
    - id: LX2-Q
      kind: text
      stage: MCQ
      proof: После ответа на все 12 вопросов MCQ считается завершённым для комплектности. Число правильных ответов остаётся
        формативной обратной связью и не является автоматической оценкой лабораторной.
    files: []
    questions:
    - Как вы убедились, что команды после SSH выполнялись именно на удалённой машине?
    - Чем открытый SSH-ключ отличается от закрытого и почему закрытый ключ нельзя отправлять преподавателю?
    - Почему tmux помогает пережить разрыв SSH, но обычный сеанс tmux не переживает перезагрузку сервера?
    complete: SSH-сервер доступен; удалённый контекст проверен; файлы переданы в обоих направлениях; public-key authentication подтверждена;
      tmux-сеанс восстановлен после нового SSH-входа; четыре компактных текстовых результата и итог MCQ внесены в отчёт.
