      kind: text
      stage: Потоки и перенаправление
      proof: Вставьте компактные метки HOME_LIST, APPEND, PASSWD_COPY, PIPELINE и первые найденные пути.
    - id: LX1-04
      kind: text
      stage: Ссылки и архив
      proof: Вставьте компактные метки ARCHIVE, RESTORE, HARD_LINK, SYMLINK_OBJECT, SYMLINK_TARGET и RESTORED_TEXT.
